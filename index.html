<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Weather App</h1>
  </header>

  <div id="search-section">
    <input type="text" id="cityInput" placeholder="Enter a city...">
    <button id="btnSearch">Search</button>
  </div>

  <div id="listSection">
    <h2>City Weather Cards</h2>
    <div id="cityList"></div>
  </div>

  <div id="controls">
    <input type="text" id="dataSearchInput" placeholder="Search cities or weather...">
    <select id="filterSelect">
      <option value="all">All</option>
      <option value="clear">Clear</option>
      <option value="clouds">Clouds</option>
      <option value="rain">Rain</option>
    </select>
    <select id="sortSelect">
      <option value="name-asc">Name A-Z</option>
      <option value="name-desc">Name Z-A</option>
      <option value="temp-asc">Temp Low-High</option>
      <option value="temp-desc">Temp High-Low</option>
    </select>
    <button id="themeToggle">Dark Mode</button>
  </div>

  <div id="loading" class="hidden">Loading...</div>
  <div id="error" class="hidden"></div>

  <div id="dashboard" class="hidden">
    <div id="currentWeather">
      <h2 id="cityName"></h2>
      <h3 id="temp"></h3>
      <p id="desc"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
